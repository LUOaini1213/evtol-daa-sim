name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DAA_REQUIRE_CPP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build C++ core
        run: python cpp/build.py build
      - name: Tests (includes Python/C++ agreement)
        run: python -m pytest -q
      - name: README numbers match results files
        run: python scripts/make_readme.py --check
