name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DAA_REQUIRE_CPP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build C++ core with g++
        run: |
          g++ --version
          python cpp/build.py build
          echo "1000 0 0 -50 0 0" | ./build/daa_cli cpa
      - name: Tests (includes Python/C++ agreement)
        run: python -m pytest -q
      - name: README numbers match results files
        run: python scripts/make_readme.py --check
