name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DAA_REQUIRE_CPP: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build C++ core
        run: python cpp/build.py build
      - name: Tests and Python/C++ agreement
        run: python -m pytest -q
      - name: README blocks, Findings and source hashes match results/
        run: python scripts/make_readme.py --check
      - name: No local machine paths in tracked files or ZIP members
        run: python scripts/check_no_local_paths.py
      - name: Historical results audit (docs/historical, source 0e85663)
        run: python scripts/check_archived_results.py
